<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada — As Aves Não Cortadas</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#3D2B0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #3D2B0F; color: #F5F0E8; font-family: 'Jost', sans-serif; padding: 2rem 1.5rem; text-align: center; }
  .rotulo { font-weight: 300; font-size: .7rem; letter-spacing: .35em; text-transform: uppercase; color: #C4962A; margin-bottom: 1.5rem; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1.1; text-wrap: balance; }
  h1 em { color: #C4962A; }
  p.txt { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.25rem; line-height: 1.6; color: rgba(245,240,232,.75); max-width: 34rem; margin: 1.5rem auto 2.5rem; text-wrap: pretty; }
  .links { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; }
  a { display: inline-block; padding: .85rem 1.6rem; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; color: #F5F0E8; border: 1px solid rgba(245,240,232,.3); transition: border-color .2s, background .2s; }
  a.principal { background: #8B6914; border-color: #8B6914; }
  a:hover { border-color: #C4962A; }
  a.principal:hover { background: #C4962A; }
  a:focus-visible { outline: 2px solid #C4962A; outline-offset: 3px; }
  .idiomas { margin-top: 2.5rem; font-size: .8rem; color: rgba(245,240,232,.65); line-height: 1.8; }
</style>
</head>
<body>
<main>
  <p class="rotulo">Erro 404</p>
  <h1>Esta página <em>não foi encontrada</em></h1>
  <p class="txt">O endereço pode ter mudado ou sido digitado de outra forma. O livro continua aqui.</p>
  <div class="links">
    <a class="principal" href="/">Página do livro</a>
    <a href="/amostra/">Ler capítulo grátis</a>
    <a href="/artigos/">Artigos</a>
  </div>
  <p class="idiomas" lang="en">Page not found. <span lang="es">Página no encontrada.</span></p>
  <div class="links" style="margin-top:.8rem">
    <a href="/en/" lang="en">English edition</a>
    <a href="/es/" lang="es">Edición en español</a>
  </div>
</main>
</body>
</html>
